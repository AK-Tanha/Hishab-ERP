services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hishab
      POSTGRES_USER: hishab
      POSTGRES_PASSWORD: hishab
    ports:
      - "5432:5432"
    volumes:
      - hishab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hishab -d hishab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - hishab_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  hishab_postgres_data:
  hishab_redis_data:
